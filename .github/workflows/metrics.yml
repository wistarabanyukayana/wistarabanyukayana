name: Metrics
on:
  schedule: [{ cron: "0 0 * * 0" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.languages.svg
          debug: yes
          base: ""
          config_timezone: Asia/Jakarta
          commits_authoring: wistarabanyukayana, Wistara Banyu Kayana, wisthara.banyu.kayana@gmail.com, wistarabanyukayana@users.noreply.github.com
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used  # recently-used crashes: GitHub removed commits from PushEvent payloads
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, shaderlab, makefile, jupyter notebook
          plugin_languages_analysis_timeout: 30
