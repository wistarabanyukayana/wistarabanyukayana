name: Languages
on:
  schedule: [{ cron: "0 0 * * 0" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/languages.py --test
      - run: python3 .github/languages.py > languages.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || { git commit -m "Update languages.svg" && git push; }
